server {
    listen 80;
    server_name _;

    # Self-hosters: replace with your domain
    # server_name metrics.example.com;

    root /var/www/metrics;
    index index.html;

    # Dashboard unified tabs (Overview / Verified / Compare)
    location = / {
        try_files /index.html =404;
    }
    location = /metrics/ {
        return 301 /;
    }
    location = /metrics/verified {
        return 301 /#verified;
    }
    location = /metrics/compare {
        return 301 /#compare;
    }

    # PHP API endpoints
    location ~ ^/metrics/api(_verified|_comparison|_reval|_events|_central|_token_issue|_community)?\.php$ {
        fastcgi_pass dashboard:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Federation community page
    location = /metrics/community {
        return 301 /metrics/community/;
    }
    location /metrics/community/ {
        try_files $uri $uri/ /metrics/community/index.html =404;
    }

    # WebSocket for live analytics (wss://...)
    location /ws/ {
        proxy_pass http://live:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Deny direct access to secrets / config
    location ~ /\.(env|git) { deny all; }
}
