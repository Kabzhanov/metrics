server {
    listen 80;
    root /var/www/metrics;
    index index.html;
    location ~ \.php$ {
        fastcgi_pass dashboard:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location /mcp/ {
        proxy_pass http://metrics-mcp:8000/;
    }
}
