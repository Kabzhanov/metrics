[project]
name = "metrics-mcp"
version = "0.1.0"
description = "MCP server for AI agent performance metrics — Model Quality Index, success rate, cost analysis"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Kabzhanov"}]
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
metrics-mcp = "metrics_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Kabzhanov/metrics"
Repository = "https://github.com/Kabzhanov/metrics"
Issues = "https://github.com/Kabzhanov/metrics/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrics_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
