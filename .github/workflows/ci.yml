name: CI

on:
  push:
    branches: [main, dev, release/**]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      METRICS_DB_HOST: localhost
      METRICS_DB_PORT: 5432
      METRICS_DB_NAME: test
      METRICS_DB_USER: test
      METRICS_DB_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff psycopg2-binary

      - name: Apply schema
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test -f schema/phase1-schema.sql
          PGPASSWORD=test psql -h localhost -U test -d test -f schema/phase2-metrics-view.sql
          PGPASSWORD=test psql -h localhost -U test -d test -f schema/phase55-git-integration.sql
          PGPASSWORD=test psql -h localhost -U test -d test -f schema/phase6-advanced-indices.sql

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Test with pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Build wheel
        run: |
          pip install build
          python -m build
