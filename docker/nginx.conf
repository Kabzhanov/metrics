server {
    listen 80;
    root /var/www/metrics;
    index index.html;
    location ~ \.php$ {
        fastcgi_pass dashboard:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
# NOTE: metrics-mcp uses stdio transport (not HTTP). MCP clients
# (Claude Code, Codex) connect via stdio, not via nginx proxy.
# See server.py:541-552 (stdio-only design).
